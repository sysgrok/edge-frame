[workspace]
resolver = "2"

members = [ 
    "edge-frame",
    "kitchen-sink",
]

[profile.release]
opt-level = "s"

[profile.dev]
debug = true # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[workspace.dependencies]
yewdux-middleware = { version = "0.4.0" }
yewdux = { version = "0.13.0", default-features = false}
yew = { version = "0.23.0", default-features = false}
yew-router = { version = "0.20.0"}

# `yew` and `yewdux` are kept in lockstep with the versions `yewdux-middleware` resolves to,
# as the `yew` and `yewdux` proc macros expand to absolute `::yew` / `::yewdux` paths and thus
# need both crates as direct dependencies.
[patch.crates-io]
yewdux-middleware = { git = "https://github.com/sysgrok/yewdux-middleware", branch = "master" }
